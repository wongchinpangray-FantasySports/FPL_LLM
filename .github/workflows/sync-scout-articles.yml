name: FFS Scout article ingest

on:
  schedule:
    # Every 2 hours — fetch + translate into pending drafts (never auto-publish).
    - cron: "20 */2 * * *"
  workflow_dispatch:

concurrency:
  group: scout-article-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional logged-in FFS Cookie header (wordpress_logged_in_*). Needed for
      # full member-gated HTML. Leave unset to ingest free teasers only.
      FFS_SESSION_COOKIE: ${{ secrets.FFS_SESSION_COOKIE }}
      FFS_AUTH_COOKIE: ${{ secrets.FFS_AUTH_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Scout ingest self-test
        working-directory: web
        run: npx tsx scripts/scout-self-test.ts

      - name: Ingest FFS articles as pending drafts
        working-directory: web
        run: npx tsx scripts/sync-scout-articles.ts --pages=1 --limit=12
