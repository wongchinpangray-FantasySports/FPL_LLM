name: WeChat daily card

on:
  schedule:
    # After FPL digest sync — card ~07:35 Shanghai (23:35 UTC)
    - cron: "35 23 * * *"
  workflow_dispatch:
    inputs:
      render_png:
        description: "Render PNG card (requires Playwright)"
        type: boolean
        default: false
      notify:
        description: "Push via webhook / PushPlus if secrets are set"
        type: boolean
        default: false

concurrency:
  group: wechat-daily-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Generate FPL morning digest
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/sync-fpl-x-digest.ts

      - name: Generate WeChat daily card
        working-directory: web
        run: |
          NOTIFY=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.notify }}" = "true" ]; then
            NOTIFY="--notify"
          fi
          npx tsx scripts/generate-wechat-daily-card.ts $NOTIFY

      - name: Install Playwright Chromium
        if: github.event_name == 'schedule' || github.event.inputs.render_png == 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: Render PNG card
        if: github.event_name == 'schedule' || github.event.inputs.render_png == 'true'
        working-directory: web
        run: node scripts/render-wechat-daily-card.mjs

      - name: Upload card artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-daily-card-${{ github.run_id }}
          path: |
            web/output/wechat-daily/card.txt
            web/output/wechat-daily/card.json
            web/output/wechat-daily/card.png
          if-no-files-found: warn
          retention-days: 14
