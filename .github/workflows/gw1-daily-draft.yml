name: FALEAGUE GW1 daily draft

on:
  schedule:
    # After WeChat card (~07:45 Shanghai = 23:45 UTC)
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      render_png:
        description: "Render pitch + rationale PNGs"
        type: boolean
        default: true

concurrency:
  group: gw1-daily-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Generate GW1 draft
        working-directory: web
        run: npx tsx scripts/generate-gw1-draft.ts

      - name: Install Playwright Chromium
        if: github.event_name == 'schedule' || github.event.inputs.render_png != 'false'
        working-directory: web
        run: npx playwright install chromium

      - name: Render pitch + rationale PNGs
        if: github.event_name == 'schedule' || github.event.inputs.render_png != 'false'
        working-directory: web
        run: node scripts/render-gw1-draft.mjs

      - name: Upload draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: faleague-gw1-draft-${{ github.run_id }}
          path: |
            web/output/gw1-draft/pack.txt
            web/output/gw1-draft/pack.json
            web/output/gw1-draft/draft-*.txt
            web/output/gw1-draft/draft-*.json
            web/output/gw1-draft/pitch-*.png
            web/output/gw1-draft/rationale-*.png
            web/output/gw1-draft/pitch.png
            web/output/gw1-draft/rationale.png
          if-no-files-found: warn
          retention-days: 14
