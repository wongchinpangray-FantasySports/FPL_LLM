name: WeChat price caution

on:
  schedule:
    # 21:00 Shanghai (13:00 UTC) — before overnight FPL price tick
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Push via webhook / PushPlus if secrets are set"
        type: boolean
        default: true

concurrency:
  group: wechat-price-caution
  cancel-in-progress: false

jobs:
  caution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Generate price caution
        working-directory: web
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.notify }}" != "true" ]; then
            FLAGS="--skip-wechat"
          fi
          npx tsx scripts/notify-price-caution.ts $FLAGS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-price-caution-${{ github.run_id }}
          path: |
            web/output/wechat-price-caution/caution.txt
            web/output/wechat-price-caution/caution.json
          if-no-files-found: warn
          retention-days: 14
