<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>FALEAGUE Squad Pitch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1440px; overflow: hidden;
        font-family: "Noto Sans SC", Inter, system-ui, sans-serif;
        background: #0b0a0f; color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .poster {
        position: relative; width: 1080px; height: 1440px; overflow: hidden;
        padding: 36px 28px 24px;
        display: flex; flex-direction: column;
        background:
          linear-gradient(180deg, rgba(11,10,15,0.22) 0%, rgba(11,10,15,0.55) 70%, #0b0a0f 100%),
          repeating-linear-gradient(90deg, #145c32 0 56px, #114f2b 56px 112px);
      }
      .glow {
        position: absolute; width: 420px; height: 420px; border-radius: 50%;
        background: radial-gradient(circle, rgba(0,255,135,0.18), transparent 70%);
        top: -120px; left: -80px; pointer-events: none; filter: blur(6px);
      }
      .top {
        position: relative; z-index: 2;
        display: flex; justify-content: space-between; align-items: flex-start;
        margin-bottom: 14px;
      }
      .brand { font-family: Inter, sans-serif; font-size: 34px; font-weight: 900; letter-spacing: -0.04em; }
      .brand span { color: #00ff87; }
      .eyebrow {
        margin-top: 6px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 800;
        letter-spacing: 0.18em; text-transform: uppercase; color: #00ff87;
      }
      .date {
        font-family: Inter, sans-serif; font-size: 40px; font-weight: 900;
        letter-spacing: -0.04em; text-align: right;
      }
      .date small {
        display: block; margin-top: 2px; font-size: 15px; letter-spacing: 0.14em;
        color: rgba(255,255,255,0.5); font-weight: 600;
      }
      .title-row {
        position: relative; z-index: 2; margin-bottom: 12px;
        display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      }
      .title-copy { flex: 1; min-width: 0; }
      h1 {
        font-size: 38px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15;
      }
      h1 .accent { color: #00ff87; }
      .sub {
        margin-top: 6px; font-size: 19px; color: rgba(255,255,255,0.7); font-weight: 600;
      }
      .chip {
        flex-shrink: 0; align-self: flex-start; margin-top: 4px;
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 16px; border-radius: 999px;
        border: 1px solid rgba(0, 255, 135, 0.45);
        background: rgba(0, 255, 135, 0.14);
        color: #00ff87;
        font-family: Inter, "Noto Sans SC", sans-serif;
        font-size: 16px; font-weight: 800; letter-spacing: 0.02em;
        box-shadow: 0 0 24px rgba(0, 255, 135, 0.18);
      }
      .chip .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #00ff87;
        box-shadow: 0 0 8px rgba(0, 255, 135, 0.9);
      }
      .chip .state {
        color: #0b0a0f; background: #00ff87;
        border-radius: 999px; padding: 2px 8px;
        font-size: 12px; font-weight: 900; letter-spacing: 0.06em;
      }
      .pitch-frame {
        position: relative; z-index: 2; flex: 1;
        border: 2px solid rgba(255,255,255,0.28);
        border-radius: 18px;
        padding: 16px 4px 12px;
        display: flex; flex-direction: column; justify-content: space-between;
        background: rgba(0,0,0,0.12);
      }
      .pitch-frame::after {
        content: ""; position: absolute; left: 50%; top: 42%;
        width: 140px; height: 140px; margin: -70px 0 0 -70px;
        border: 2px solid rgba(255,255,255,0.22); border-radius: 50%;
        pointer-events: none;
      }
      .row {
        display: flex; justify-content: space-evenly; align-items: flex-start;
        width: 100%; position: relative; z-index: 1;
      }
      .row.n1 { justify-content: center; }
      .row.n3 { padding: 0 12px; justify-content: space-between; }
      .row.n4 { padding: 0 2px; justify-content: space-between; }
      .player {
        width: 220px; display: flex; flex-direction: column; align-items: center; position: relative;
      }
      .row.n4 .player { width: 250px; }
      .avatar-wrap {
        position: relative;
        width: 148px; height: 148px;
        margin-bottom: 0;
      }
      .avatar {
        width: 148px; height: 148px;
        border-radius: 24px;
        object-fit: contain; object-position: center;
        padding: 4px;
        background: transparent;
        border: none;
        box-shadow: 0 10px 22px rgba(0,0,0,0.35);
        filter: drop-shadow(0 8px 14px rgba(0,0,0,0.35));
      }
      .badge {
        position: absolute; top: -4px; right: -4px; width: 34px; height: 34px;
        border-radius: 50%; background: #18181b; color: #fff;
        font-family: Inter, sans-serif; font-size: 15px; font-weight: 900;
        display: flex; align-items: center; justify-content: center;
        border: 2px solid rgba(255,255,255,0.35); z-index: 3;
      }
      .badge.c { background: #00ff87; color: #0b0a0f; border-color: #00ff87; }
      .plate {
        margin-top: -18px; width: 100%;
        background: #fff; border-radius: 12px; padding: 18px 8px 8px; text-align: center;
        box-shadow: 0 6px 14px rgba(0,0,0,0.25);
      }
      .name {
        color: #111; font-size: 18px; font-weight: 800; line-height: 1.1;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .stat {
        margin-top: 3px; color: #0b0a0f; font-family: Inter, sans-serif;
        font-size: 16px; font-weight: 800;
      }
      .stat.accent { color: #067a45; }
      .meta {
        margin-top: 3px; color: #52525b; font-size: 13px; font-weight: 700;
        line-height: 1.25;
      }
      .meta .sep { color: #a1a1aa; margin: 0 3px; }
      .bench {
        position: relative; z-index: 2;
        margin-top: 12px; padding: 12px 2px 10px;
        border-radius: 16px; background: rgba(11,10,15,0.62);
        border: 1px solid rgba(255,255,255,0.12);
      }
      .bench-label {
        text-align: center; font-family: Inter, sans-serif; font-size: 13px;
        font-weight: 800; letter-spacing: 0.16em; color: #00ff87; margin-bottom: 8px;
      }
      .bench .row { padding: 0; justify-content: space-between; }
      .bench .player { width: 255px; }
      .bench .avatar-wrap, .bench .avatar { width: 120px; height: 120px; }
      .bench .avatar { border-radius: 18px; }
      .bench .name { font-size: 16px; }
      .bench .stat { font-size: 14px; }
      .bench .meta { font-size: 12px; }
      .bench .plate { padding-top: 16px; margin-top: -16px; }
      .footer {
        position: relative; z-index: 2; margin-top: 12px;
        display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
      }
      .legend {
        font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.78); line-height: 1.35;
        max-width: 760px;
      }
      .legend strong { color: #00ff87; font-family: Inter, sans-serif; }
      .foot-meta {
        text-align: right; font-family: Inter, sans-serif; font-size: 15px; font-weight: 700;
        color: rgba(255,255,255,0.55); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="poster" id="root"></div>
    <script>
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function stamp(date) {
        const m = String(date || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return m ? { mmdd: `${m[2]}.${m[3]}`, yyyy: m[1] } : { mmdd: date || "", yyyy: "" };
      }
      function avatarHtml(p) {
        const src = p.shirt_url || p.photo_url || "";
        return `<div class="avatar-wrap">
          ${p.is_captain ? '<div class="badge c">C</div>' : p.is_vice ? '<div class="badge">V</div>' : ""}
          <img class="avatar shirt" src="${esc(src)}" alt="" />
        </div>`;
      }
      function playerHtml(p) {
        const hasStat = p.stat_display && p.stat_display !== "- / -" && p.stat_display !== "-";
        const price = p.price != null ? `£${Number(p.price).toFixed(1)}` : "—";
        const sel =
          p.selected_by_percent != null
            ? `${Number(p.selected_by_percent).toFixed(1)}%`
            : "—";
        return `<div class="player">
          ${avatarHtml(p)}
          <div class="plate">
            <div class="name">${esc(p.web_name)}</div>
            <div class="stat ${hasStat ? "accent" : ""}">${esc(p.stat_display)}</div>
            <div class="meta">${esc(p.fixture || "—")}<span class="sep">·</span>${esc(sel)}<span class="sep">·</span>${esc(price)}</div>
          </div>
        </div>`;
      }
      function row(players) {
        const n = players.length;
        const cls = n === 1 ? "n1" : n === 3 ? "n3" : n === 4 ? "n4" : "";
        return `<div class="row ${cls}">${players.map(playerHtml).join("")}</div>`;
      }
      function chipHtml(data) {
        if (!data.chip) return "";
        const label = data.chip.label || "Bench Boost";
        const state = data.chip.state || "ACTIVE";
        return `<div class="chip"><span class="dot"></span>${esc(label)}<span class="state">${esc(state)}</span></div>`;
      }
      function render(data) {
        const d = stamp(data.date);
        const xi = data.starters || [];
        const gk = xi.filter((p) => p.position === "GKP");
        const def = xi.filter((p) => p.position === "DEF");
        const mid = xi.filter((p) => p.position === "MID");
        const fwd = xi.filter((p) => p.position === "FWD");
        document.getElementById("root").innerHTML = `
          <div class="glow"></div>
          <div class="top">
            <div>
              <div class="brand">FA<span>LEAGUE</span></div>
              <div class="eyebrow">${esc(data.eyebrow)}</div>
            </div>
            <div class="date">${esc(d.mmdd)}<small>${esc(d.yyyy)}</small></div>
          </div>
          <div class="title-row">
            <div class="title-copy">
              <h1>${data.titleHtml || esc(data.title)}</h1>
              <div class="sub">${esc(data.subtitle)}</div>
            </div>
            ${chipHtml(data)}
          </div>
          <div class="pitch-frame">
            ${row(gk)}
            ${row(def)}
            ${row(mid)}
            ${row(fwd)}
          </div>
          ${
            (data.bench || []).length
              ? `<div class="bench">
            <div class="bench-label">BENCH</div>
            <div class="row n4">${(data.bench || []).map(playerHtml).join("")}</div>
          </div>`
              : ""
          }
          <div class="footer">
            <div class="legend">${data.legendHtml || esc(data.legend)}</div>
            <div class="foot-meta">${esc(data.meta)}</div>
          </div>`;
      }
      if (window.__SQUAD__) render(window.__SQUAD__);
    </script>
  </body>
</html>
