<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>FALEAGUE Mini 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1440px; overflow: hidden;
        font-family: "Noto Sans SC", Inter, system-ui, sans-serif;
        background: #0b0a0f; color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
      }
      .poster {
        position: relative; width: 1080px; height: 1440px; overflow: hidden;
        padding: 40px 40px 32px;
        display: flex; flex-direction: column;
      }
      .bg {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(11,10,15,0.2) 0%, rgba(11,10,15,0.82) 55%, #0b0a0f 100%),
          repeating-linear-gradient(
            90deg,
            #145c32 0px, #145c32 56px,
            #114f2b 56px, #114f2b 112px
          );
        opacity: 0.58;
      }
      .glow-a, .glow-b {
        position: absolute; border-radius: 50%; pointer-events: none; filter: blur(12px);
      }
      .glow-a {
        width: 520px; height: 520px; top: -160px; left: -120px;
        background: radial-gradient(circle, rgba(0,255,135,0.28), transparent 70%);
      }
      .glow-b {
        width: 440px; height: 440px; bottom: 120px; right: -140px;
        background: radial-gradient(circle, rgba(0,255,135,0.16), transparent 70%);
      }
      .wm {
        position: absolute; right: -30px; top: 280px;
        font-family: Inter, sans-serif; font-size: 200px; font-weight: 900;
        letter-spacing: -0.08em; color: rgba(255,255,255,0.03);
        transform: rotate(-12deg); pointer-events: none; z-index: 1;
      }
      .content {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; height: 100%; gap: 14px;
      }

      .top {
        display: flex; justify-content: space-between; align-items: flex-start;
        flex: 0 0 auto;
      }
      .brand { font-family: Inter, sans-serif; font-size: 32px; font-weight: 900; letter-spacing: -0.04em; }
      .brand span { color: #00ff87; }
      .eyebrow {
        margin-top: 6px; display: inline-flex; align-items: center; gap: 8px;
        font-family: Inter, sans-serif; font-size: 13px; font-weight: 800;
        letter-spacing: 0.18em; text-transform: uppercase; color: #00ff87;
      }
      .live-dot {
        width: 9px; height: 9px; border-radius: 50%; background: #00ff87;
        box-shadow: 0 0 0 4px rgba(0,255,135,0.22);
      }
      .date {
        font-family: Inter, sans-serif; font-size: 44px; font-weight: 900;
        letter-spacing: -0.05em; text-align: right;
      }
      .date small {
        display: block; margin-top: 2px; font-size: 15px; letter-spacing: 0.16em;
        color: rgba(244,244,245,0.5); font-weight: 600;
      }

      .hero {
        position: relative; flex: 0 0 auto;
        padding: 20px 24px 18px;
        border-radius: 22px;
        background: rgba(11,10,15,0.76);
        border: 1px solid rgba(0,255,135,0.28);
        overflow: hidden;
      }
      .hero::before {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 9px; background: #00ff87;
      }
      .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .chip {
        font-size: 14px; font-weight: 800;
        padding: 6px 12px; border-radius: 999px;
        background: rgba(0,255,135,0.12); color: #00ff87;
        border: 1px solid rgba(0,255,135,0.28);
      }
      h1 {
        font-size: 46px; font-weight: 900; line-height: 1.12; letter-spacing: -0.03em;
      }
      h1 .accent { color: #00ff87; }
      .sub {
        margin-top: 8px; font-size: 20px; line-height: 1.35;
        color: rgba(244,244,245,0.7);
      }

      .main {
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: column; gap: 12px;
      }

      .pitch-card {
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: column;
        padding: 12px 14px 12px;
        border-radius: 22px;
        background: rgba(11,10,15,0.78);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .pitch-label {
        flex: 0 0 auto;
        font-family: Inter, sans-serif; font-size: 12px; font-weight: 800;
        letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244,244,245,0.55);
        margin-bottom: 8px;
      }
      .mini-pitch {
        position: relative; flex: 1 1 auto; min-height: 360px;
        border-radius: 16px; overflow: hidden;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 10px 12px 8px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(125,255,168,0.1), transparent 42%),
          radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.28), transparent 48%),
          linear-gradient(180deg, #1c8250 0%, #157043 55%, #0f5230 100%);
        border: 1px solid rgba(0,255,135,0.22);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      }
      .mini-pitch::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.9;
        background-image: repeating-linear-gradient(
          90deg, rgba(255,255,255,0.05) 0 22px, rgba(0,0,0,0.07) 22px 44px
        );
      }
      .pitch-mark {
        position: absolute; inset: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 0;
      }
      .row {
        position: relative; z-index: 1;
        display: grid; grid-template-columns: 1fr 1fr;
        justify-items: center; align-items: center; gap: 18px;
      }
      .row.gk-row {
        grid-template-columns: 1fr;
        padding-bottom: 0;
      }

      .pcard {
        width: 210px;
        border-radius: 18px;
        overflow: hidden;
        text-align: left;
        background: linear-gradient(180deg, #1a2430 0%, #121820 55%, #0b1016 100%);
        box-shadow: 0 12px 26px rgba(0,0,0,0.42);
        border: 1px solid rgba(255,255,255,0.16);
        position: relative;
      }
      .pcard.cap {
        border-color: rgba(125,255,168,0.65);
        box-shadow:
          0 0 0 4px rgba(125,255,168,0.2),
          0 12px 26px rgba(0,0,0,0.42);
      }
      .pcard::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(135deg, rgba(125,255,168,0.14) 0%, transparent 42%, rgba(255,255,255,0.04) 100%);
      }
      .pcard-inner { position: relative; padding: 12px 12px 11px; }
      .pcard-top {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 8px;
      }
      .pos-badge {
        font-family: Inter, sans-serif; font-size: 12px; font-weight: 800;
        letter-spacing: 0.08em; text-transform: uppercase;
        padding: 4px 8px; border-radius: 6px;
        background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.9);
      }
      .c-badge {
        font-family: Inter, sans-serif; font-size: 13px; font-weight: 900;
        padding: 4px 10px; border-radius: 999px;
        background: #7dffa8; color: #062016;
      }
      .pcard-name {
        min-height: 46px; display: flex; align-items: center; justify-content: center;
        text-align: center; font-size: 24px; font-weight: 900; line-height: 1.1;
        color: #fff; letter-spacing: -0.02em;
      }
      .pcard-team {
        text-align: center; margin-top: 2px;
        font-family: Inter, sans-serif; font-size: 13px; font-weight: 700;
        letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55);
      }
      .pcard-stats {
        margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
        border-radius: 10px; background: rgba(0,0,0,0.35); padding: 8px 4px; text-align: center;
      }
      .pcard-stats .lab {
        font-family: Inter, sans-serif; font-size: 10px; font-weight: 700;
        letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.45);
      }
      .pcard-stats .val {
        margin-top: 2px; font-family: Inter, sans-serif; font-size: 16px; font-weight: 800;
        color: rgba(255,255,255,0.92);
        font-variant-numeric: tabular-nums;
      }

      .feature-row {
        flex: 0 0 auto;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      }
      .feat {
        padding: 14px 14px 12px; border-radius: 16px;
        background: rgba(11,10,15,0.78);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .feat .kicker {
        font-family: Inter, sans-serif; font-size: 11px; font-weight: 800;
        letter-spacing: 0.14em; text-transform: uppercase; color: #00ff87;
        margin-bottom: 6px;
      }
      .feat h3 { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.2; }
      .feat p { margin-top: 6px; font-size: 15px; line-height: 1.35; color: rgba(244,244,245,0.68); }

      .bottom-band {
        flex: 0 0 auto;
        display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px;
      }
      .reward {
        display: flex; align-items: center; gap: 14px;
        padding: 16px 18px; border-radius: 16px;
        background: rgba(0,255,135,0.1);
        border: 1px solid rgba(0,255,135,0.28);
      }
      .reward .plus {
        flex: 0 0 auto;
        font-family: Inter, sans-serif; font-size: 40px; font-weight: 900;
        color: #00ff87; letter-spacing: -0.04em;
      }
      .reward .copy strong {
        display: block; font-size: 20px; font-weight: 900; margin-bottom: 4px;
      }
      .reward .copy span {
        font-size: 15px; color: rgba(244,244,245,0.7); line-height: 1.35;
      }
      .steps {
        display: flex; align-items: stretch; gap: 0;
        padding: 10px 8px; border-radius: 16px;
        background: rgba(11,10,15,0.78);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .step {
        flex: 1; text-align: center; padding: 6px 8px; position: relative;
      }
      .step:not(:last-child)::after {
        content: "›"; position: absolute; right: -4px; top: 50%;
        transform: translateY(-54%);
        font-size: 22px; font-weight: 900; color: rgba(0,255,135,0.55);
      }
      .step .n {
        font-family: Inter, sans-serif; font-size: 12px; font-weight: 800;
        letter-spacing: 0.12em; color: #00ff87; margin-bottom: 4px;
      }
      .step .t { font-size: 18px; font-weight: 900; line-height: 1.2; }
      .step .d {
        margin-top: 4px; font-size: 13px; line-height: 1.25;
        color: rgba(244,244,245,0.6);
      }

      .footer { flex: 0 0 auto; }
      .cta-bar {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        padding: 18px 24px; border-radius: 16px; background: #00ff87; color: #0b0a0f;
        box-shadow: 0 12px 40px rgba(0,255,135,0.25);
      }
      .cta-bar .cta { font-size: 24px; font-weight: 900; }
      .cta-bar .url { font-family: Inter, sans-serif; font-size: 17px; font-weight: 700; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div class="poster" id="root"></div>
    <script>
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function stamp(date) {
        const [y, m, d] = String(date || "").split("-");
        return { yyyy: y || "", mmdd: `${m || ""}.${d || ""}` };
      }
      function render(data) {
        const d = stamp(data.date);
        const chips = (data.chips || []).map((c) => `<span class="chip">${esc(c)}</span>`).join("");
        const feats = (data.features || []).map((f) => `
          <div class="feat">
            <div class="kicker">${esc(f.kicker)}</div>
            <h3>${esc(f.title)}</h3>
            <p>${esc(f.body)}</p>
          </div>`).join("");

        function card(p) {
          if (!p) return "";
          return `
            <div class="pcard${p.cap ? " cap" : ""}">
              <div class="pcard-inner">
                <div class="pcard-top">
                  <span class="pos-badge">${esc(p.pos)}</span>
                  ${p.cap ? `<span class="c-badge">C</span>` : `<span></span>`}
                </div>
                <div class="pcard-name">${esc(p.name)}</div>
                <div class="pcard-team">${esc(p.team)}</div>
                <div class="pcard-stats">
                  <div><div class="lab">Pts</div><div class="val">${esc(p.pts)}</div></div>
                  <div><div class="lab">Form</div><div class="val">${esc(p.form)}</div></div>
                  <div><div class="lab">Mini%</div><div class="val">${esc(p.own)}</div></div>
                </div>
              </div>
            </div>`;
        }

        const row1 = (data.row1 || []).map(card).join("");
        const row2 = (data.row2 || []).map(card).join("");
        const gk = card(data.gk);
        const steps = (data.steps || []).map((s, i) => `
          <div class="step">
            <div class="n">0${i + 1}</div>
            <div class="t">${esc(s.title)}</div>
            <div class="d">${esc(s.body)}</div>
          </div>`).join("");

        document.getElementById("root").innerHTML = `
          <div class="bg"></div>
          <div class="glow-a"></div><div class="glow-b"></div>
          <div class="wm">MINI</div>
          <div class="content">
            <div class="top">
              <div>
                <div class="brand">FA<span>LEAGUE</span></div>
                <div class="eyebrow"><span class="live-dot"></span>${esc(data.eyebrow)}</div>
              </div>
              <div class="date">${esc(d.mmdd)}<small>${esc(d.yyyy)}</small></div>
            </div>
            <div class="hero">
              <div class="chip-row">${chips}</div>
              <h1>${data.titleHtml || esc(data.title)}</h1>
              <p class="sub">${esc(data.subtitle)}</p>
            </div>
            <div class="main">
              <div class="pitch-card">
                <div class="pitch-label">${esc(data.pitchLabel || "MINI 5 FORMATION")}</div>
                <div class="mini-pitch">
                  <svg class="pitch-mark" viewBox="0 0 100 72" preserveAspectRatio="none" aria-hidden="true">
                    <rect x="3.5" y="3.5" width="93" height="65" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="0.75"/>
                    <line x1="3.5" y1="3.5" x2="96.5" y2="3.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.9"/>
                    <path d="M 36 3.5 A 14 14 0 0 0 64 3.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
                    <circle cx="50" cy="3.5" r="1.05" fill="rgba(255,255,255,0.4)"/>
                    <rect x="22" y="44" width="56" height="24.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.6"/>
                    <rect x="34" y="56.5" width="32" height="12" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="0.5"/>
                    <circle cx="50" cy="51" r="0.85" fill="rgba(255,255,255,0.35)"/>
                    <path d="M 38 44 A 12 12 0 0 1 62 44" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
                    <rect x="42" y="68" width="16" height="2.2" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.7"/>
                  </svg>
                  <div class="row">${row1}</div>
                  <div class="row">${row2}</div>
                  <div class="row gk-row">${gk}</div>
                </div>
              </div>
              <div class="feature-row">${feats}</div>
              <div class="bottom-band">
                <div class="reward">
                  <div class="plus">${esc(data.rewardPlus || "+2")}</div>
                  <div class="copy">
                    <strong>${esc(data.rewardTitle)}</strong>
                    <span>${esc(data.rewardBody)}</span>
                  </div>
                </div>
                <div class="steps">${steps}</div>
              </div>
            </div>
            <div class="footer">
              <div class="cta-bar">
                <div class="cta">${esc(data.cta)}</div>
                <div class="url">${esc(data.url)}</div>
              </div>
            </div>
          </div>`;
      }
      if (window.__DATA__) render(window.__DATA__);
    </script>
  </body>
</html>
