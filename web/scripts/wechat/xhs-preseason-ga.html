<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>FALEAGUE Preseason G/A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1440px; overflow: hidden;
        font-family: "Noto Sans SC", Inter, system-ui, sans-serif;
        background: #0b0a0f; color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
      }
      .poster {
        position: relative; width: 1080px; height: 1440px; overflow: hidden;
        padding: 40px 40px 28px;
        display: flex; flex-direction: column;
      }
      .pitch {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(11,10,15,0.22) 0%, rgba(11,10,15,0.78) 58%, #0b0a0f 100%),
          repeating-linear-gradient(
            90deg,
            #145c32 0px, #145c32 56px,
            #114f2b 56px, #114f2b 112px
          );
        opacity: 0.55;
      }
      .glow-a, .glow-b, .glow-c {
        position: absolute; border-radius: 50%; pointer-events: none; filter: blur(10px);
      }
      .glow-a {
        width: 520px; height: 520px; top: -160px; left: -120px;
        background: radial-gradient(circle, rgba(0,255,135,0.28), transparent 70%);
      }
      .glow-b {
        width: 420px; height: 420px; top: 34%; right: -140px;
        background: radial-gradient(circle, rgba(0,255,135,0.14), transparent 70%);
      }
      .glow-c {
        width: 360px; height: 360px; bottom: 60px; left: 18%;
        background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
      }
      .grid-dots {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.22;
        background-image: radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), transparent 70%);
      }
      .content {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; height: 100%;
        min-height: 0;
      }

      .top {
        flex-shrink: 0;
        display: flex; justify-content: space-between; align-items: flex-start;
        margin-bottom: 12px;
      }
      .brand {
        font-family: Inter, sans-serif; font-size: 32px; font-weight: 900;
        letter-spacing: -0.04em;
      }
      .brand span { color: #00ff87; }
      .eyebrow {
        margin-top: 6px; display: inline-flex; align-items: center; gap: 8px;
        font-family: Inter, sans-serif; font-size: 13px; font-weight: 800;
        letter-spacing: 0.16em; text-transform: uppercase; color: #00ff87;
      }
      .live-dot {
        width: 9px; height: 9px; border-radius: 50%; background: #00ff87;
        box-shadow: 0 0 0 4px rgba(0,255,135,0.2);
      }
      .date-block { text-align: right; }
      .date {
        font-family: Inter, sans-serif; font-size: 44px; font-weight: 900;
        letter-spacing: -0.05em; line-height: 1;
      }
      .date small {
        display: block; margin-top: 4px; font-size: 14px; letter-spacing: 0.14em;
        color: rgba(244,244,245,0.5); font-weight: 700;
      }
      .page-chip {
        display: inline-block; margin-top: 8px; padding: 4px 10px;
        border-radius: 999px; font-size: 13px; font-weight: 800;
        letter-spacing: 0.08em; color: #00ff87;
        border: 1px solid rgba(0,255,135,0.35);
        background: rgba(0,255,135,0.08);
      }

      .hero {
        position: relative;
        flex-shrink: 0;
        padding: 12px 18px 10px 22px;
        border-radius: 18px;
        background: rgba(11,10,15,0.78);
        border: 1px solid rgba(0,255,135,0.3);
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        margin-bottom: 10px;
        overflow: hidden;
      }
      .hero::before {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 8px;
        background: #00ff87;
      }
      .hero h1 {
        font-size: 32px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15;
      }
      .hero h1 .accent { color: #00ff87; }
      .hero .sub {
        margin-top: 4px; font-size: 15px; font-weight: 700;
        color: rgba(244,244,245,0.62); line-height: 1.3;
      }
      .stats {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        margin-top: 8px;
      }
      .stat {
        padding: 8px 10px; border-radius: 12px;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .stat .v {
        font-family: Inter, sans-serif; font-size: 24px; font-weight: 900;
        color: #00ff87; letter-spacing: -0.03em; line-height: 1;
      }
      .stat .l {
        margin-top: 3px; font-size: 12px; font-weight: 700;
        color: rgba(244,244,245,0.5); letter-spacing: 0.06em;
      }

      .board {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column; gap: 6px;
        overflow: hidden;
      }
      .club {
        flex: 1 1 0;
        min-height: 0;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        gap: 10px; align-items: center;
        padding: 7px 11px;
        border-radius: 14px;
        background: rgba(11,10,15,0.82);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .club.top {
        border-color: rgba(0,255,135,0.35);
        background: linear-gradient(105deg, rgba(0,255,135,0.12), rgba(11,10,15,0.88));
      }
      .badge {
        width: 38px; height: 38px; object-fit: contain;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
      }
      .badge-fallback {
        width: 38px; height: 38px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-family: Inter, sans-serif; font-size: 12px; font-weight: 900;
        color: #00ff87; background: rgba(0,255,135,0.1);
        border: 1px solid rgba(0,255,135,0.25);
      }
      .club-name {
        font-size: 18px; font-weight: 900; letter-spacing: -0.02em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        margin-bottom: 2px;
      }
      .meta-rows { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .meta-row {
        display: grid; grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px; align-items: center; min-width: 0;
      }
      .tag {
        font-family: Inter, sans-serif; font-size: 12px; font-weight: 900;
        letter-spacing: 0.04em; text-align: center;
        padding: 3px 0; border-radius: 8px;
      }
      .tag.g {
        color: #04140c; background: #00ff87;
      }
      .tag.a {
        color: #e0e7ff; background: rgba(129,140,248,0.35);
        border: 1px solid rgba(165,180,252,0.45);
      }
      .names {
        font-size: 14px; font-weight: 700; line-height: 1.15;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .names.g { color: rgba(244,244,245,0.88); }
      .names.a { color: rgba(199,210,254,0.9); }
      .names.muted { color: rgba(244,244,245,0.38); font-weight: 600; }
      .ga {
        display: flex; gap: 8px; align-items: center;
      }
      .pill {
        min-width: 52px; padding: 6px 8px; border-radius: 12px; text-align: center;
        background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);
      }
      .pill .n {
        font-family: Inter, sans-serif; font-size: 22px; font-weight: 900;
        line-height: 1; color: #00ff87;
      }
      .pill .t {
        margin-top: 2px; font-size: 11px; font-weight: 800;
        letter-spacing: 0.08em; color: rgba(244,244,245,0.45);
      }
      .pill.a .n { color: #a5b4fc; }

      .footer {
        flex-shrink: 0;
        margin-top: 10px;
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; border-radius: 16px;
        background: #00ff87; color: #0b0a0f;
      }
      .footer .cta { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
      .footer .url {
        font-family: Inter, sans-serif; font-size: 15px; font-weight: 800;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="poster" id="root"></div>
    <script>
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function stamp(date) {
        const m = String(date || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return m ? { mmdd: `${m[2]}.${m[3]}`, yyyy: m[1] } : { mmdd: date || "", yyyy: "" };
      }
      function render(data) {
        const d = stamp(data.date);
        const clubs = (data.clubs || []).map((c, i) => {
          const badge = c.badge
            ? `<img class="badge" src="${esc(c.badge)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="badge-fallback" style="display:none">${esc((c.pl_code||"?").slice(0,3))}</div>`
            : `<div class="badge-fallback">${esc((c.pl_code||"?").slice(0,3))}</div>`;
          const assistMuted = !c.assists || /未收录|暂无/.test(c.assists_line || "");
          return `
            <article class="club${i < 3 && data.page === 1 ? " top" : ""}">
              <div>${badge}</div>
              <div>
                <div class="club-name">${esc(c.short || c.pl_name)}</div>
                <div class="meta-rows">
                  <div class="meta-row">
                    <div class="tag g">进球</div>
                    <div class="names g">${esc(c.scorers_line || "—")}</div>
                  </div>
                  <div class="meta-row">
                    <div class="tag a">助攻</div>
                    <div class="names a${assistMuted ? " muted" : ""}">${esc(c.assists_line || "—")}</div>
                  </div>
                </div>
              </div>
              <div class="ga">
                <div class="pill"><div class="n">${esc(c.goals)}</div><div class="t">GOALS</div></div>
                <div class="pill a"><div class="n">${esc(c.assists)}</div><div class="t">AST</div></div>
              </div>
            </article>`;
        }).join("");

        document.getElementById("root").innerHTML = `
          <div class="pitch"></div>
          <div class="glow-a"></div><div class="glow-b"></div><div class="glow-c"></div>
          <div class="grid-dots"></div>
          <div class="content">
            <div class="top">
              <div>
                <div class="brand">FA<span>LEAGUE</span></div>
                <div class="eyebrow"><span class="live-dot"></span>PRESEASON G/A</div>
              </div>
              <div class="date-block">
                <div class="date">${esc(d.mmdd)}<small>${esc(d.yyyy)}</small></div>
                <div class="page-chip">PAGE ${esc(data.page)} / ${esc(data.total_pages)}</div>
              </div>
            </div>
            <div class="hero">
              <h1>${data.page === 1 ? '季前赛<span class="accent">进球 & 助攻</span>' : '季前赛 G/A <span class="accent">续</span>'}</h1>
              <p class="sub">${esc(data.subtitle || "英超各队至今 · 进球/助攻分行")}</p>
              <div class="stats">
                <div class="stat"><div class="v">${esc(data.total_clubs)}</div><div class="l">CLUBS</div></div>
                <div class="stat"><div class="v">${esc(data.total_goals)}</div><div class="l">GOALS</div></div>
                <div class="stat"><div class="v">${esc(data.total_assists)}</div><div class="l">ASSISTS</div></div>
              </div>
            </div>
            <div class="board">${clubs}</div>
            <div class="footer">
              <div class="cta">${esc(data.cta || "打开季前赛信号 →")}</div>
              <div class="url">${esc(data.url || "faleague-ai.com")}</div>
            </div>
          </div>`;
      }
      if (window.__DATA__) render(window.__DATA__);
    </script>
  </body>
</html>
