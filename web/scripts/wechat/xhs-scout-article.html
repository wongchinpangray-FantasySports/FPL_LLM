<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>FALEAGUE Scout XHS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1440px; overflow: hidden;
        font-family: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", Inter, system-ui, sans-serif;
        background: #0b0a0f; color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
      }
      .poster {
        position: relative; width: 1080px; height: 1440px; overflow: hidden;
        padding: 36px 40px 28px;
        display: flex; flex-direction: column;
      }
      .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 70% 50% at 10% 0%, rgba(0,255,135,0.16), transparent 50%),
          radial-gradient(ellipse 60% 40% at 100% 20%, rgba(55,0,60,0.25), transparent 45%),
          linear-gradient(180deg, #0f0c16 0%, #0b0a0f 100%);
      }
      .pitch-stripe {
        position: absolute; inset: 0; opacity: 0.07; pointer-events: none;
        background: repeating-linear-gradient(90deg, #145c32 0 56px, #114f2b 56px 112px);
      }
      .wm {
        position: absolute; right: -8px; top: 300px;
        font-family: Inter, sans-serif; font-size: 150px; font-weight: 900;
        letter-spacing: -0.08em; color: rgba(255,255,255,0.03);
        pointer-events: none;
      }
      .content {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; height: 100%; min-height: 0;
      }
      .top {
        display: flex; justify-content: space-between; align-items: flex-start;
        margin-bottom: 16px; flex-shrink: 0;
      }
      .brand { font-family: Inter, sans-serif; font-size: 30px; font-weight: 900; letter-spacing: -0.04em; }
      .brand span { color: #00ff87; }
      .eyebrow {
        margin-top: 5px; font-size: 15px; font-weight: 800;
        letter-spacing: 0.08em; color: #00ff87;
      }
      .page-meta { text-align: right; }
      .page-num {
        font-family: Inter, sans-serif; font-size: 36px; font-weight: 900; letter-spacing: -0.04em;
      }
      .page-total { font-size: 14px; font-weight: 700; color: rgba(244,244,245,0.45); letter-spacing: 0.08em; }

      .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
      .content:has(.teaser-page) .chips { padding: 0 40px; }
      .chip {
        padding: 7px 14px; border-radius: 999px;
        background: rgba(55,0,60,0.7); border: 1px solid rgba(0,255,135,0.3);
        font-size: 15px; font-weight: 800; color: #00ff87; letter-spacing: 0.06em;
      }
      .chip.muted {
        background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14);
        color: rgba(244,244,245,0.8);
      }

      .cover-hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .cover-hero > h1 { font-size: 38px; flex-shrink: 0; }
      h1 {
        font-size: 46px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.22;
      }
      h1.long { font-size: 38px; }
      h1.longer { font-size: 32px; }
      .sub {
        margin-top: 14px; font-size: 24px; line-height: 1.45;
        color: rgba(244,244,245,0.72); font-weight: 600;
      }
      .hero-img {
        margin-top: 22px; max-height: 480px;
        border-radius: 18px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(0,0,0,0.28);
        display: flex; align-items: center; justify-content: center;
        flex: 0 1 auto;
      }
      .hero-img img {
        width: 100%; max-height: 480px; object-fit: contain; display: block;
      }
      .hero-img.hidden, figure.hidden { display: none; }
      .swipe {
        margin-top: auto; padding-top: 18px;
        font-size: 20px; font-weight: 800; color: rgba(244,244,245,0.55);
      }
      .swipe em { color: #00ff87; font-style: normal; }

      .feed-grid {
        margin-top: 16px;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .feed-grid.cols-1 { grid-template-columns: 1fr; }
      /* 3 cards: two on top, third full-width so landscape Scout photos keep the face. */
      .feed-grid.cols-3 {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1.15fr 0.85fr;
      }
      .feed-grid.cols-3 .feed-card:nth-child(3) {
        grid-column: 1 / -1;
      }
      .feed-grid.cols-3 .feed-card:nth-child(3) .thumb img {
        object-position: center 18%;
      }
      .feed-card {
        display: flex; flex-direction: column; min-height: 0;
        background: rgba(255,255,255,0.045);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        overflow: hidden;
      }
      .feed-card .card-head {
        display: flex; gap: 10px; align-items: flex-start;
        padding: 13px 15px 9px;
        flex-shrink: 0;
      }
      .feed-card .idx {
        flex-shrink: 0; font-family: Inter, sans-serif;
        font-size: 18px; font-weight: 900; color: #00ff87;
        padding-top: 3px; letter-spacing: 0.04em;
      }
      .feed-card h3 {
        font-size: 20px; font-weight: 800; line-height: 1.34;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .feed-card .thumb {
        flex: 1; min-height: 160px; background: rgba(0,0,0,0.28);
        overflow: hidden;
        position: relative;
      }
      .feed-card .thumb img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        object-position: center top;
        display: block;
      }
      .feed-card .thumb.face img {
        object-position: center 12%;
      }
      .feed-card .thumb.graphic img {
        object-fit: contain;
        object-position: center;
      }
      .feed-card .thumb.logo {
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,255,135,0.06);
      }
      .feed-card .thumb.logo img {
        position: static;
        object-fit: contain; width: 72%; height: 72%;
      }
      .feed-card .thumb.empty {
        min-height: 88px;
        background: linear-gradient(180deg, rgba(0,255,135,0.08), rgba(255,255,255,0.03));
      }
      .feed-card .thumb.schedule {
        position: static;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10px 12px 12px;
        background: linear-gradient(180deg, rgba(0,255,135,0.10), rgba(0,0,0,0.38));
        gap: 3px;
      }
      .feed-card .sched-kicker {
        font-size: 12px; font-weight: 800; letter-spacing: 0.10em;
        color: #00ff87; margin-bottom: 4px; text-transform: none;
      }
      .feed-card .sched-row {
        display: flex; gap: 8px; align-items: baseline;
        font-size: 15px; font-weight: 800; line-height: 1.28;
      }
      .feed-card .sched-time {
        font-family: Inter, sans-serif;
        color: #00ff87;
        width: 72px;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .feed-card .sched-name { color: #f4f4f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .teaser-hero.schedule {
        height: auto;
        min-height: 220px;
        padding: 18px 22px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(180deg, rgba(0,255,135,0.10), rgba(0,0,0,0.38));
      }
      .teaser-hero.schedule .sched-kicker {
        font-size: 16px; font-weight: 800; letter-spacing: 0.10em;
        color: #00ff87; margin-bottom: 6px;
      }
      .teaser-hero.schedule .sched-row {
        display: flex; gap: 16px; align-items: baseline;
        font-size: 26px; font-weight: 800; line-height: 1.35;
      }
      .teaser-hero.schedule .sched-time {
        font-family: Inter, sans-serif;
        color: #00ff87;
        width: 110px;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .teaser-page {
        flex: 1; display: flex; flex-direction: column; min-height: 0;
      }
      .teaser-page h1 { flex-shrink: 0; font-size: 32px; padding: 0 40px; line-height: 1.24; }
      .teaser-page h1.long { font-size: 28px; }
      .teaser-page h1.longer { font-size: 24px; }
      .teaser-copy {
        padding: 14px 52px 6px !important;
        flex: 0 1 auto; min-height: 0; overflow: hidden;
        font-size: 24px !important; line-height: 1.88 !important;
        letter-spacing: 0.015em;
      }
      .teaser-copy p { margin: 0 0 22px !important; }
      .teaser-copy p:last-child { margin-bottom: 0 !important; }
      .teaser-hero {
        flex: 1 1 auto;
        min-height: 180px;
        max-height: 460px;
        margin-top: 12px;
        height: auto;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(0,0,0,0.28);
      }
      .teaser-hero.graphic { min-height: 240px; }
      .teaser-hero img {
        width: 100%; height: 100%; object-fit: cover;
        object-position: center top;
        display: block;
      }
      .teaser-hero.graphic img {
        object-fit: contain;
        object-position: center;
      }
      .teaser-hero.hidden { display: none; }
      .teaser-more {
        margin-top: 10px; flex-shrink: 0;
        font-size: 21px; font-weight: 800; color: rgba(244,244,245,0.5);
      }
      .teaser-more em { color: #00ff87; font-style: normal; }
      .close-head { flex-shrink: 0; }
      .close-head h1 { margin-top: 4px; font-size: 40px; line-height: 1.18; }
      .close-head .sub { margin-top: 14px; font-size: 22px; line-height: 1.45; }
      .close-swipe {
        margin-top: 12px !important;
        padding-top: 8px;
        flex-shrink: 0;
        font-size: 18px;
      }
      .close-more {
        margin-top: 20px;
        flex: 1 1 auto;
        min-height: 0;
        height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .close-more .kicker {
        font-size: 18px; font-weight: 800; letter-spacing: 0.10em;
        color: #00ff87; margin-bottom: 6px; flex-shrink: 0;
      }
      .close-more ol {
        list-style: none; padding: 0; margin: 0;
        flex: 1 1 auto;
        min-height: 0;
        height: 0;
        display: flex; flex-direction: column;
        justify-content: space-evenly;
      }
      .close-more li {
        display: flex; gap: 13px; align-items: center;
        flex: 1 1 0;
        min-height: 0;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,0.10);
        font-size: 27px; font-weight: 800; line-height: 1.38;
      }
      .close-more li:last-child { border-bottom: 0; }
      .close-more .idx {
        flex-shrink: 0; font-family: Inter, sans-serif;
        font-size: 21px; font-weight: 900; color: #00ff87;
        padding-top: 2px; width: 45px;
      }
      .close-more .ttl {
        min-width: 0;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .body-kicker {
        flex-shrink: 0;
        padding-bottom: 12px; margin-bottom: 4px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .body-kicker h2 {
        font-size: 22px; font-weight: 800; line-height: 1.3;
        color: rgba(244,244,245,0.88);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .body-copy {
        flex: 1; min-height: 0; overflow: hidden;
        width: 100%;
        font-size: 28px; line-height: 1.55; font-weight: 600;
        color: #e8e6ef;
        padding-top: 18px;
        word-break: normal;
        overflow-wrap: break-word;
      }
      .body-copy p { margin: 0 0 16px; }
      .body-copy h1, .body-copy h2, .body-copy h3, .body-copy h4 {
        font-size: 30px; font-weight: 900; line-height: 1.28;
        color: #00ff87; letter-spacing: -0.02em;
        margin: 4px 0 14px;
      }
      .body-copy ul, .body-copy ol {
        margin: 0 0 16px; padding-left: 0; list-style: none;
      }
      .body-copy li {
        position: relative;
        display: block;
        padding-left: 22px;
        margin-bottom: 10px;
        line-height: 1.45;
      }
      .body-copy li::before {
        content: ""; position: absolute; left: 0; top: 12px;
        width: 8px; height: 8px; border-radius: 50%;
        background: #00ff87;
        box-shadow: 0 0 8px rgba(0,255,135,0.45);
      }
      .body-copy a { color: #7dffc3; text-decoration: none; }
      .body-copy blockquote {
        margin: 0 0 16px; padding: 14px 16px 12px;
        border-left: 4px solid #00ff87;
        background: rgba(0,255,135,0.07);
        border-radius: 0 12px 12px 0;
        font-size: 25px; line-height: 1.5; color: rgba(244,244,245,0.88);
      }
      .body-copy blockquote p { margin: 0 0 8px; }
      .body-copy blockquote p:last-child { margin: 0; }
      .body-copy figure {
        margin: 0 0 16px; text-align: center;
      }
      .body-copy img {
        max-width: 100%; max-height: 460px;
        object-fit: contain; border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.1);
        background: #16131c;
      }
      .body-copy em, .body-copy figcaption {
        display: block; margin-top: 6px;
        font-size: 20px; font-style: normal; font-weight: 600;
        color: rgba(244,244,245,0.5); line-height: 1.35;
      }
      .body-copy table {
        width: 100%; border-collapse: collapse; font-size: 22px; margin-bottom: 16px;
      }
      .body-copy th, .body-copy td {
        text-align: left; padding: 8px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .body-copy th { color: #00ff87; font-size: 16px; letter-spacing: 0.08em; }

      .footer {
        margin-top: 10px; padding-top: 12px; flex-shrink: 0;
        border-top: 1px solid rgba(255,255,255,0.1);
        display: flex; align-items: center; gap: 16px;
        font-size: 15px; font-weight: 700;
        color: rgba(244,244,245,0.48);
      }
      .footer-left {
        display: flex; align-items: center; gap: 12px; min-width: 0;
      }
      .ffs-logo {
        height: 44px; width: auto; max-width: 210px;
        object-fit: contain; flex-shrink: 0; border-radius: 6px;
      }
      .ffs-mark {
        flex-shrink: 0; font-family: Inter, sans-serif;
        font-size: 12px; font-weight: 800; letter-spacing: 0.04em;
        color: rgba(244,244,245,0.45);
      }
      .footer-copy { line-height: 1.35; min-width: 0; }
      .footer strong { color: #00ff87; font-weight: 800; }

      #measure-root {
        position: absolute; left: -2400px; top: 0;
        width: 1000px; pointer-events: none;
      }
      #measure-col.body-copy {
        padding-top: 0;
      }
      .mblock { }

      /* Xiaohongshu palette: coral → pink → purple on white */
      .poster.theme-xhs { color: #1a1020; }
      .poster.theme-xhs .bg {
        background: #ffffff;
      }
      .poster.theme-xhs .pitch-stripe { display: none; }
      .poster.theme-xhs .wm { color: rgba(255, 45, 120, 0.04); }
      .poster.theme-xhs .brand span {
        background: linear-gradient(135deg, #FF4D4D 0%, #FF2D78 52%, #9B3DFF 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .poster.theme-xhs .eyebrow { color: #FF2D78; }
      .poster.theme-xhs .page-total { color: rgba(26, 16, 32, 0.42); }
      .poster.theme-xhs .chip {
        background: linear-gradient(135deg, rgba(255, 77, 77, 0.12), rgba(155, 61, 255, 0.10));
        border-color: rgba(255, 45, 120, 0.35);
        color: #D81B7A;
      }
      .poster.theme-xhs .chip.muted {
        background: rgba(26, 16, 32, 0.04);
        border-color: rgba(26, 16, 32, 0.10);
        color: rgba(26, 16, 32, 0.72);
      }
      .poster.theme-xhs .sub { color: rgba(26, 16, 32, 0.62); }
      .poster.theme-xhs .swipe { color: rgba(26, 16, 32, 0.48); }
      .poster.theme-xhs .swipe em {
        background: linear-gradient(135deg, #FF4D4D, #9B3DFF);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-style: normal;
      }
      .poster.theme-xhs .feed-card {
        background: rgba(255, 255, 255, 0.88);
        border-color: rgba(255, 45, 120, 0.18);
        box-shadow: 0 8px 28px rgba(155, 61, 255, 0.08);
      }
      .poster.theme-xhs .feed-card .idx {
        background: linear-gradient(135deg, #FF4D4D, #9B3DFF);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .poster.theme-xhs .feed-card .thumb { background: rgba(255, 245, 250, 0.9); }
      .poster.theme-xhs .feed-card .thumb.empty {
        background: linear-gradient(180deg, rgba(255, 77, 77, 0.08), rgba(155, 61, 255, 0.06));
      }
      .poster.theme-xhs .feed-card .sched-kicker,
      .poster.theme-xhs .feed-card .sched-time,
      .poster.theme-xhs .teaser-hero.schedule .sched-kicker,
      .poster.theme-xhs .teaser-hero.schedule .sched-time { color: #FF2D78; }
      .poster.theme-xhs .feed-card .sched-name,
      .poster.theme-xhs .teaser-hero.schedule .sched-row { color: #1a1020; }
      .poster.theme-xhs .teaser-hero.schedule {
        background: linear-gradient(180deg, rgba(255, 77, 77, 0.08), rgba(155, 61, 255, 0.06));
      }
      .poster.theme-xhs .teaser-copy { color: #2a2030 !important; }
      .poster.theme-xhs .teaser-more { color: rgba(26, 16, 32, 0.45); }
      .poster.theme-xhs .teaser-more em { color: #FF2D78; -webkit-text-fill-color: #FF2D78; }
      .poster.theme-xhs .teaser-hero {
        border-color: rgba(255, 45, 120, 0.16);
        background: rgba(255, 250, 252, 0.95);
      }
      .poster.theme-xhs .close-more .kicker { color: #FF2D78; }
      .poster.theme-xhs .close-more .idx {
        background: linear-gradient(135deg, #FF4D4D, #9B3DFF);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .poster.theme-xhs .close-more li { border-bottom-color: rgba(255, 45, 120, 0.14); }
      .poster.theme-xhs .body-copy { color: #2a2030; }
      .poster.theme-xhs .body-copy h1,
      .poster.theme-xhs .body-copy h2,
      .poster.theme-xhs .body-copy h3,
      .poster.theme-xhs .body-copy h4,
      .poster.theme-xhs .body-copy th { color: #FF2D78; }
      .poster.theme-xhs .body-copy li::before {
        background: linear-gradient(135deg, #FF4D4D, #9B3DFF);
        box-shadow: 0 0 8px rgba(255, 45, 120, 0.35);
      }
      .poster.theme-xhs .body-copy blockquote {
        border-left-color: #FF2D78;
        background: rgba(255, 45, 120, 0.06);
      }
      .poster.theme-xhs .body-kicker { border-bottom-color: rgba(255, 45, 120, 0.14); }
      .poster.theme-xhs .body-kicker h2 { color: rgba(26, 16, 32, 0.82); }
      .poster.theme-xhs .footer {
        border-top-color: rgba(255, 45, 120, 0.14);
        color: rgba(26, 16, 32, 0.45);
      }
      .poster.theme-xhs .footer strong { color: #FF2D78; }
      .poster.theme-xhs .ffs-mark { color: rgba(26, 16, 32, 0.42); }
    </style>
  </head>
  <body>
    <div class="poster" id="root"></div>
    <div id="measure-root"><div id="measure-col" class="body-copy"></div></div>
    <script>
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function waitImages(root, ms) {
        const imgs = Array.from(root.querySelectorAll("img"));
        if (!imgs.length) return Promise.resolve();
        return Promise.all(imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((res) => {
            const done = () => res();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", () => {
              img.style.display = "none";
              const wrap = img.closest(".hero-img, figure");
              if (wrap) wrap.classList.add("hidden");
              done();
            }, { once: true });
            setTimeout(done, ms || 2500);
          });
        }));
      }
      window.measureBlocks = async function (blocks) {
        const col = document.getElementById("measure-col");
        col.innerHTML = blocks.map((h, i) =>
          `<div class="mblock" data-i="${i}">${h}</div>`
        ).join("");
        await waitImages(col, 8000);
        return Array.from(col.querySelectorAll(".mblock")).map((el) => el.offsetHeight);
      };
      window.bodyOverflow = function () {
        const el = document.querySelector(".close-more") || document.querySelector(".body-copy");
        if (!el) return 0;
        return el.scrollHeight - el.clientHeight;
      };
      window.waitPageImages = function () {
        return waitImages(document.getElementById("root"), 8000);
      };
      function scheduleHtml(title, slots) {
        if (!Array.isArray(slots) || !slots.length) return "";
        const kicker = title ? `<div class="sched-kicker">${esc(title)}</div>` : "";
        const rows = slots.map((s) => {
          const mark = s.mark ? `${esc(s.mark)} ` : "";
          return `<div class="sched-row"><span class="sched-time">${esc(s.time)}</span><span class="sched-name">${mark}${esc(s.name)}</span></div>`;
        }).join("");
        return `${kicker}${rows}`;
      }
      function titleClass(title) {
        const n = String(title || "").length;
        if (n > 42) return "longer";
        if (n > 28) return "long";
        return "";
      }
      window.renderPage = function (data) {
        const isCover = data.kind === "cover";
        const pageLabel = `第 ${data.page}/${data.total}`;
        const logoSrc = data.logoSrc || "";
        const logoHtml = logoSrc
          ? `<img class="ffs-logo" src="${esc(logoSrc)}" alt="Powered by FFS">`
          : `<div class="ffs-mark">Powered by FFS</div>`;
        const footer = `
          <div class="footer">
            <div class="footer-left">
              ${logoHtml}
              <div class="footer-copy">
                <div>${esc(pageLabel)} · Fantasy Football Scout 中文 · Faleague</div>
              </div>
            </div>
          </div>`;
        const chips = `
          <div class="chips">
            ${data.seriesLabel ? `<div class="chip">${esc(data.seriesLabel)}</div>` : ""}
            ${data.gwTag ? `<div class="chip muted">${esc(data.gwTag)}</div>` : ""}
            <div class="chip muted">Fantasy Football Scout 中文</div>
          </div>`;

        const showPitch =
          data.theme !== "xhs" &&
          (isCover || data.kind === "feed-cover" || data.kind === "feed-close");
        let inner = "";
        if (data.kind === "feed-cover") {
          const cards = data.items || [];
          const cols = cards.length <= 2 ? "cols-1" : cards.length === 3 ? "cols-3" : "";
          const items = cards.map((item, i) => {
            const logoLike = /ffs-logo/i.test(item.heroSrc || "");
            const graphic = item.heroFit === "contain" && !logoLike && !item.face;
            const sched = Array.isArray(item.schedule) ? item.schedule : [];
            let thumb;
            if (sched.length) {
              thumb = `<div class="thumb schedule">${scheduleHtml(item.scheduleTitle, sched)}</div>`;
            } else if (item.heroSrc) {
              thumb = `<div class="thumb${logoLike ? " logo" : ""}${item.face ? " face" : ""}${graphic ? " graphic" : ""}"><img src="${esc(item.heroSrc)}" alt=""></div>`;
            } else {
              thumb = `<div class="thumb empty"></div>`;
            }
            return `<li class="feed-card">
              <div class="card-head"><span class="idx">${String(i + 1).padStart(2, "0")}</span><h3>${esc(item.title)}</h3></div>
              ${thumb}
            </li>`;
          }).join("");
          inner = `
            ${chips}
            <div class="cover-hero">
              <h1 class="${titleClass(data.title)}">${esc(data.title)}</h1>
              <ol class="feed-grid ${cols}">${items}</ol>
              <div class="swipe">左滑看精选</div>
            </div>`;
        } else if (data.kind === "teaser") {
          const graphic = data.heroFit === "contain";
          const sched = Array.isArray(data.schedule) ? data.schedule : [];
          let hero = "";
          if (sched.length) {
            hero = `<div class="teaser-hero schedule">${scheduleHtml(data.scheduleTitle, sched)}</div>`;
          } else if (data.heroSrc) {
            hero = `<div class="teaser-hero${graphic ? " graphic" : ""}"><img src="${esc(data.heroSrc)}" alt=""></div>`;
          }
          inner = `
            ${chips}
            <div class="teaser-page">
              <h1 class="${titleClass(data.title)}">${esc(data.title)}</h1>
              <div class="body-copy teaser-copy">${data.html || ""}</div>
              ${hero}
              <div class="teaser-more">完整内容在 <em>Faleague Scout 中文</em></div>
            </div>`;
        } else if (data.kind === "feed-close") {
          const more = Array.isArray(data.moreTitles) ? data.moreTitles : [];
          const moreHtml = more.length
            ? `<div class="close-more">
                <div class="kicker">未上封面 · 专栏里还有</div>
                <ol>${more.map((t, i) =>
                  `<li><span class="idx">${String(i + 1).padStart(2, "0")}</span><span class="ttl">${esc(t)}</span></li>`
                ).join("")}</ol>
              </div>`
            : "";
          inner = `
            <div class="close-head">
              <h1>${esc(data.title || "完整文章在 Faleague")}</h1>
              <div class="sub">${esc(data.subtitle || "去 Scout 中文专栏看全文、笔记和伤情。")}</div>
            </div>
            ${moreHtml}
            <div class="swipe close-swipe"><em>Faleague</em> · Scout 中文</div>`;
        } else if (isCover) {
          inner = `
            ${chips}
            <div class="cover-hero">
              <h1 class="${titleClass(data.title)}">${esc(data.title)}</h1>
              ${data.subtitle ? `<div class="sub">${esc(data.subtitle)}</div>` : ""}
              ${data.heroSrc ? `<div class="hero-img"><img src="${esc(data.heroSrc)}" alt=""></div>` : ""}
              <div class="swipe">左滑看精选</div>
            </div>`;
        } else {
          inner = `
            <div class="body-kicker"><h2>${esc(data.title)}</h2></div>
            <div class="body-copy">${data.html || ""}</div>`;
        }

        document.getElementById("root").innerHTML = `
          <div class="bg"></div>
          ${showPitch ? '<div class="pitch-stripe"></div>' : ""}
          <div class="wm">FFS</div>
          <div class="content">
            <div class="top">
              <div>
                <div class="brand">FA<span>LEAGUE</span></div>
                <div class="eyebrow">FANTASY FOOTBALL SCOUT 中文</div>
              </div>
              <div class="page-meta">
                <div class="page-num">${String(data.page).padStart(2, "0")} / ${String(data.total).padStart(2, "0")}</div>
                <div class="page-total">SWIPE →</div>
              </div>
            </div>
            ${inner}
            ${footer}
          </div>`;
        const root = document.getElementById("root");
        const isXhs = data.theme === "xhs";
        root.className = isXhs ? "poster theme-xhs" : "poster";
        document.documentElement.style.background = isXhs ? "#ffffff" : "#0b0a0f";
        document.body.style.background = isXhs ? "#ffffff" : "#0b0a0f";
        document.body.style.color = isXhs ? "#1a1020" : "#f4f4f5";
      };
    </script>
  </body>
</html>
