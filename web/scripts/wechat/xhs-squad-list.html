<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>FALEAGUE Squad List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1440px; overflow: hidden;
        font-family: "Noto Sans SC", Inter, system-ui, sans-serif;
        background: #0b0a0f; color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
      }
      .poster {
        position: relative; width: 1080px; height: 1440px; overflow: hidden;
        padding: 40px 28px 32px;
        display: flex; flex-direction: column;
        background:
          radial-gradient(ellipse 80% 50% at 8% -12%, rgba(0,255,135,0.18), transparent 55%),
          radial-gradient(ellipse 55% 40% at 100% 10%, rgba(0,255,135,0.08), transparent 50%),
          #0b0a0f;
      }
      .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
      .brand { font-family: Inter, sans-serif; font-size: 32px; font-weight: 900; letter-spacing: -0.04em; }
      .brand span { color: #00ff87; }
      .eyebrow {
        margin-top: 6px; font-family: Inter, sans-serif; font-size: 13px; font-weight: 800;
        letter-spacing: 0.18em; text-transform: uppercase; color: #00ff87;
      }
      .date {
        font-family: Inter, sans-serif; font-size: 40px; font-weight: 900;
        letter-spacing: -0.04em; text-align: right;
      }
      .date small {
        display: block; margin-top: 2px; font-size: 14px; letter-spacing: 0.14em;
        color: rgba(244,244,245,0.45); font-weight: 600;
      }
      h1 {
        font-size: 36px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15;
        margin-bottom: 6px;
      }
      h1 .accent { color: #00ff87; }
      .title-row {
        display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
        margin-bottom: 14px;
      }
      .title-copy { flex: 1; min-width: 0; }
      .sub { font-size: 18px; color: rgba(244,244,245,0.65); margin-bottom: 0; }
      .chip {
        flex-shrink: 0; align-self: flex-start; margin-top: 2px;
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 16px; border-radius: 999px;
        border: 1px solid rgba(0, 255, 135, 0.45);
        background: rgba(0, 255, 135, 0.14);
        color: #00ff87;
        font-family: Inter, "Noto Sans SC", sans-serif;
        font-size: 16px; font-weight: 800; letter-spacing: 0.02em;
        box-shadow: 0 0 24px rgba(0, 255, 135, 0.18);
      }
      .chip .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #00ff87;
        box-shadow: 0 0 8px rgba(0, 255, 135, 0.9);
      }
      .chip .state {
        color: #0b0a0f; background: #00ff87;
        border-radius: 999px; padding: 2px 8px;
        font-size: 12px; font-weight: 900; letter-spacing: 0.06em;
      }
      .panel {
        flex: 0 0 auto; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03); overflow: hidden;
        display: flex; flex-direction: column;
      }
      .cols {
        --grid:
          1.35fr 0.95fr 0.55fr 0.55fr 0.6fr 0.55fr 0.5fr 0.45fr 0.45fr 0.55fr 0.6fr 0.6fr 0.6fr 0.55fr;
      }
      .head, .row {
        display: grid;
        grid-template-columns: var(--grid);
        gap: 4px;
        align-items: center;
        padding: 8px 10px;
      }
      .head {
        font-size: 12px; font-weight: 800;
        color: rgba(244,244,245,0.45);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(0,0,0,0.22);
      }
      .head .xp { color: #00ff87; }
      .head span { text-align: right; }
      .head span:nth-child(1),
      .head span:nth-child(2),
      .head span:nth-child(3) { text-align: left; }
      .rows { display: flex; flex-direction: column; }
      .row {
        border-bottom: 1px solid rgba(255,255,255,0.05);
        font-size: 13px;
        min-height: 44px;
      }
      .row.bench { opacity: 0.78; }
      .row.cap { background: rgba(0,255,135,0.08); }
      .name {
        font-size: 14px; font-weight: 800; line-height: 1.15;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .name .tag {
        display: inline-block; margin-left: 4px; font-family: Inter, sans-serif;
        font-size: 11px; font-weight: 900; color: #00ff87;
      }
      .team, .pos {
        font-size: 12px; color: rgba(244,244,245,0.55); font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .num {
        font-family: Inter, sans-serif; font-size: 13px; font-weight: 700;
        text-align: right; letter-spacing: -0.02em; tabular-nums;
      }
      .num.xp { color: #00ff87; font-weight: 800; }
      .num.muted { color: rgba(244,244,245,0.35); }
      .section {
        padding: 7px 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em;
        color: #00ff87; background: rgba(0,255,135,0.06);
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }
      .why {
        flex: 1; min-height: 0; margin-top: 16px; padding: 22px 24px;
        border-radius: 16px;
        border: 1px solid rgba(0,255,135,0.22);
        background: rgba(0,255,135,0.06);
        display: flex; flex-direction: column;
      }
      .why-label {
        font-family: Inter, "Noto Sans SC", sans-serif;
        font-size: 16px; font-weight: 800; letter-spacing: 0.14em;
        color: #00ff87; margin-bottom: 8px; flex-shrink: 0;
      }
      .why ul {
        list-style: none; flex: 1; min-height: 0;
        display: flex; flex-direction: column;
        justify-content: stretch; gap: 0;
      }
      .why li {
        position: relative; padding-left: 22px;
        flex: 1; display: flex; align-items: center;
        font-size: 18px; font-weight: 500; line-height: 1.5;
        color: rgba(244,244,245,0.88);
      }
      .why li::before {
        content: ""; position: absolute; left: 0; top: 50%;
        transform: translateY(-50%);
        width: 8px; height: 8px; border-radius: 50%; background: #00ff87;
      }
      .source {
        margin-top: 10px; font-size: 14px; font-weight: 700;
        color: rgba(244,244,245,0.55); line-height: 1.4; flex-shrink: 0;
      }
      .source strong { color: #00ff87; font-weight: 800; }
      .note {
        margin-top: 8px; font-size: 13px; color: rgba(244,244,245,0.45); line-height: 1.35; flex-shrink: 0;
      }
      .footer { padding-top: 12px; }
      .cta-bar {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        padding: 16px 22px; border-radius: 16px; background: #00ff87; color: #0b0a0f;
      }
      .cta-bar .cta { font-size: 22px; font-weight: 900; }
      .cta-bar .url { font-family: Inter, sans-serif; font-size: 16px; font-weight: 700; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div class="poster" id="root"></div>
    <script>
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function stamp(date) {
        const m = String(date || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return m ? { mmdd: `${m[2]}.${m[3]}`, yyyy: m[1] } : { mmdd: date || "", yyyy: "" };
      }
      function fmt(v, digits = 1) {
        if (v == null || v === "" || Number.isNaN(Number(v))) return "—";
        const n = Number(v);
        if (!Number.isFinite(n)) return "—";
        return Number.isInteger(n) && digits === 0 ? String(n) : n.toFixed(digits);
      }
      function cell(v, digits = 1, cls = "") {
        const text = fmt(v, digits);
        const muted = text === "—" ? "muted" : "";
        return `<div class="num ${cls} ${muted}">${esc(text)}</div>`;
      }
      function rowHtml(p, bench = false) {
        const tag = p.is_captain ? '<span class="tag">C</span>' : p.is_vice ? '<span class="tag">V</span>' : "";
        return `<div class="row cols ${bench ? "bench" : ""} ${p.is_captain ? "cap" : ""}">
          <div class="name">${esc(p.web_name)}${tag}</div>
          <div class="team">${esc(p.team_short || p.team || "—")}</div>
          <div class="pos">${esc(p.position || "—")}</div>
          ${cell(p.price, 1)}
          <div class="num ${p.selected_by_percent == null ? "muted" : ""}">${p.selected_by_percent == null ? "—" : `${esc(fmt(p.selected_by_percent, 1))}%`}</div>
          ${cell(p.xp_total, 1, "xp")}
          ${cell(p.expected_minutes_next, 0)}
          ${cell(p.goals, 0)}
          ${cell(p.assists, 0)}
          ${cell(p.threat, 1)}
          ${cell(p.xg_per_90, 2)}
          ${cell(p.xa_per_90, 2)}
          ${cell(p.dc_per_90, 1)}
          ${cell(p.value_per_million, 2)}
        </div>`;
      }
      function chipHtml(data) {
        if (!data.chip) return "";
        const label = data.chip.label || "Bench Boost";
        const state = data.chip.state || "ACTIVE";
        return `<div class="chip"><span class="dot"></span>${esc(label)}<span class="state">${esc(state)}</span></div>`;
      }
      function render(data) {
        const d = stamp(data.date);
        const starters = (data.starters || []).map((p) => rowHtml(p, false)).join("");
        const bench = (data.bench || []).map((p) => rowHtml(p, true)).join("");
        document.getElementById("root").innerHTML = `
          <div class="top">
            <div>
              <div class="brand">FA<span>LEAGUE</span></div>
              <div class="eyebrow">${esc(data.eyebrow)}</div>
            </div>
            <div class="date">${esc(d.mmdd)}<small>${esc(d.yyyy)}</small></div>
          </div>
          <div class="title-row">
            <div class="title-copy">
              <h1>${data.titleHtml || esc(data.title)}</h1>
              <p class="sub">${esc(data.subtitle)}</p>
            </div>
            ${chipHtml(data)}
          </div>
          <div class="panel cols">
            <div class="head cols">
              <span>球员</span><span>球队</span><span>位置</span><span>身价</span><span>持有%</span>
              <span class="xp">XP</span><span>出场</span><span>进球</span><span>助攻</span><span>威胁</span>
              <span>xG/90</span><span>xA/90</span><span>DC/90</span><span>£/m</span>
            </div>
            <div class="section">STARTING XI · ${esc(data.formation)}</div>
            <div class="rows">${starters}</div>
            ${
              (data.bench || []).length
                ? `<div class="section">BENCH</div>
            <div class="rows">${bench}</div>`
                : ""
            }
          </div>
          ${
            Array.isArray(data.why) && data.why.length
              ? `<div class="why">
                  <div class="why-label">${esc(data.whyLabel || "WHY · 选队理由")}</div>
                  <ul>${data.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
                </div>`
              : ""
          }
          ${
            data.source
              ? `<div class="source">${data.sourceHtml || esc(data.source)}</div>`
              : ""
          }
          <div class="note">${esc(data.note || "")}</div>
          <div class="footer">
            <div class="cta-bar">
              <div class="cta">${esc(data.cta)}</div>
              <div class="url">${esc(data.url)}</div>
            </div>
          </div>`;
      }
      if (window.__SQUAD__) render(window.__SQUAD__);
    </script>
  </body>
</html>
