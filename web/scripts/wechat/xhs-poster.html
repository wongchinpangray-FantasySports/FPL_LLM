<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>FALEAGUE XHS Poster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        font-family: "Noto Sans SC", Inter, system-ui, sans-serif;
        background: #0b0a0f;
        color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        padding: 56px 52px 48px;
        display: flex;
        flex-direction: column;
        background: #0b0a0f;
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 90% 55% at 0% -10%, rgba(0, 255, 135, 0.22), transparent 55%),
          radial-gradient(ellipse 70% 50% at 110% 20%, rgba(0, 255, 135, 0.1), transparent 50%),
          radial-gradient(circle at 80% 90%, rgba(0, 255, 135, 0.06), transparent 45%),
          linear-gradient(180deg, #121018 0%, #0b0a0f 55%, #08070b 100%);
        pointer-events: none;
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 70%);
        pointer-events: none;
      }

      .watermark {
        position: absolute;
        right: -40px;
        top: 180px;
        font-family: Inter, sans-serif;
        font-size: 320px;
        font-weight: 900;
        letter-spacing: -0.08em;
        color: rgba(0, 255, 135, 0.06);
        line-height: 0.8;
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 28px;
      }

      .brand-lockup .brand {
        font-family: Inter, sans-serif;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .brand-lockup .brand span {
        color: #00ff87;
      }

      .brand-lockup .eyebrow {
        margin-top: 10px;
        font-family: Inter, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #00ff87;
      }

      .date-stamp {
        text-align: right;
      }

      .date-stamp .mmdd {
        font-family: Inter, sans-serif;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fff;
      }

      .date-stamp .yyyy {
        margin-top: 4px;
        font-family: Inter, sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: rgba(244, 244, 245, 0.45);
      }

      .hero {
        margin-bottom: 34px;
      }

      .hero h1 {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.03em;
        max-width: 920px;
      }

      .hero h1 .accent {
        color: #00ff87;
      }

      .hero .sub {
        margin-top: 16px;
        font-size: 24px;
        line-height: 1.45;
        color: rgba(244, 244, 245, 0.68);
        max-width: 900px;
      }

      .accent-rule {
        width: 88px;
        height: 6px;
        background: #00ff87;
        border-radius: 999px;
        margin: 22px 0 0;
      }

      .stories {
        display: flex;
        flex-direction: column;
        gap: 0;
        flex: 1;
      }

      .story {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 18px;
        padding: 22px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .story:last-child {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .story.hot {
        background: linear-gradient(
          90deg,
          rgba(0, 255, 135, 0.12),
          rgba(0, 255, 135, 0.02) 55%,
          transparent
        );
        margin: 0 -24px;
        padding-left: 24px;
        padding-right: 24px;
        border-top-color: rgba(0, 255, 135, 0.25);
      }

      .story .idx {
        font-family: Inter, sans-serif;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.06em;
        color: #00ff87;
        line-height: 1;
        padding-top: 2px;
      }

      .story .label {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: rgba(244, 244, 245, 0.45);
        margin-bottom: 8px;
      }

      .story.hot .label {
        color: #00ff87;
      }

      .story .lead {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.3;
        color: #fff;
      }

      .story .detail {
        margin-top: 8px;
        font-size: 22px;
        line-height: 1.4;
        color: rgba(244, 244, 245, 0.62);
      }

      .scores {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 14px;
      }

      .score {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.28);
        border-radius: 16px;
        padding: 16px 18px;
      }

      .score .teams {
        font-size: 18px;
        font-weight: 700;
        color: rgba(244, 244, 245, 0.55);
        margin-bottom: 6px;
      }

      .score .digits {
        font-family: Inter, sans-serif;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #00ff87;
        line-height: 1;
      }

      .fixture-board {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
      }

      .fixture-day-label {
        font-family: Inter, sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #00ff87;
        text-transform: uppercase;
      }

      .fixture-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .fixture-line {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .fixture-line .pair {
        font-size: 16px;
        font-weight: 700;
        color: rgba(244, 244, 245, 0.78);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bullet-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 10px;
      }

      .bullet-list .bullet {
        position: relative;
        padding-left: 16px;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.35;
        color: rgba(244, 244, 245, 0.78);
      }

      .bullet-list .bullet::before {
        content: "•";
        position: absolute;
        left: 0;
        color: #00ff87;
      }

      /* BoP ranking layout */
      .hero-metric {
        display: flex;
        align-items: flex-end;
        gap: 18px;
        margin-bottom: 8px;
      }

      .hero-metric .price {
        font-family: Inter, sans-serif;
        font-size: 120px;
        font-weight: 900;
        letter-spacing: -0.08em;
        line-height: 0.85;
        color: #00ff87;
      }

      .hero-metric .pos {
        padding-bottom: 14px;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .ranks {
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex: 1;
        margin-top: 8px;
      }

      .rank {
        display: grid;
        grid-template-columns: 72px 1fr auto;
        align-items: center;
        gap: 18px;
        padding: 22px 24px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
      }

      .rank.gold {
        border-color: rgba(0, 255, 135, 0.45);
        background: linear-gradient(
          105deg,
          rgba(0, 255, 135, 0.18),
          rgba(0, 255, 135, 0.04) 60%,
          transparent
        );
        box-shadow: 0 0 0 1px rgba(0, 255, 135, 0.08), 0 18px 40px rgba(0, 0, 0, 0.25);
      }

      .rank .num {
        font-family: Inter, sans-serif;
        font-size: 40px;
        font-weight: 900;
        color: #00ff87;
        letter-spacing: -0.06em;
      }

      .rank .name {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .rank .team {
        margin-top: 4px;
        font-size: 18px;
        font-weight: 600;
        color: rgba(244, 244, 245, 0.5);
      }

      .rank .metric {
        text-align: right;
      }

      .rank .metric .v {
        font-family: Inter, sans-serif;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: #00ff87;
        line-height: 1;
      }

      .rank .metric .l {
        margin-top: 4px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(244, 244, 245, 0.45);
        text-transform: uppercase;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .chip {
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(0, 255, 135, 0.35);
        background: rgba(0, 255, 135, 0.1);
        color: #00ff87;
        font-size: 18px;
        font-weight: 700;
      }

      .footer {
        margin-top: auto;
        padding-top: 28px;
      }

      .cta-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 28px;
        border-radius: 18px;
        background: #00ff87;
        color: #0b0a0f;
      }

      .cta-bar .cta {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .cta-bar .url {
        font-family: Inter, sans-serif;
        font-size: 18px;
        font-weight: 700;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="poster" id="root"></div>
    <script>
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatDateStamp(date) {
        const m = String(date || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return { mmdd: date || "", yyyy: "" };
        return { mmdd: `${m[2]}.${m[3]}`, yyyy: m[1] };
      }

      function renderDaily(data) {
        const stamp = formatDateStamp(data.date);
        const stories = (data.stories || [])
          .map((s, i) => {
            const groups = s.fixtureGroups || [];
            const bullets = (s.bullets || []).filter(Boolean);
            let extras = "";
            if (groups.length) {
              extras = `<div class="fixture-board">${groups
                .slice(0, 3)
                .map((g) => {
                  const rows = (g.fixtures || [])
                    .slice(0, 6)
                    .map((f) => {
                      return `<div class="fixture-line"><span class="pair">${esc(f.home)} vs ${esc(f.away)}</span></div>`;
                    })
                    .join("");
                  return `<div class="fixture-day-label">${esc(g.dateShort || g.dateLabel)} · ${esc(String(g.count))}场</div><div class="fixture-list">${rows}</div>`;
                })
                .join("")}</div>`;
            } else if (bullets.length) {
              extras = `<div class="bullet-list">${bullets
                .map((b) => `<div class="bullet">${esc(b)}</div>`)
                .join("")}</div>`;
            } else if (s.scores && s.scores.length) {
              extras = `<div class="scores">${s.scores
                .map(
                  (sc) => `
                    <div class="score">
                      <div class="teams">${esc(sc.teams)}</div>
                      <div class="digits">${esc(sc.digits)}</div>
                    </div>`,
                )
                .join("")}</div>`;
            }
            return `
              <article class="story ${s.hot ? "hot" : ""}">
                <div class="idx">${String(i + 1).padStart(2, "0")}</div>
                <div>
                  <div class="label">${esc(s.label)}</div>
                  <div class="lead">${esc(s.lead)}</div>
                  ${!bullets.length && s.detail ? `<div class="detail">${esc(s.detail)}</div>` : ""}
                  ${extras}
                </div>
              </article>`;
          })
          .join("");

        return `
          <div class="watermark">${esc(stamp.mmdd)}</div>
          <div class="content">
            <div class="top">
              <div class="brand-lockup">
                <div class="brand">FALE<span>AGUE</span></div>
                <div class="eyebrow">${esc(data.eyebrow)}</div>
              </div>
              <div class="date-stamp">
                <div class="mmdd">${esc(stamp.mmdd)}</div>
                <div class="yyyy">${esc(stamp.yyyy)}</div>
              </div>
            </div>
            <div class="hero">
              <h1>${data.titleHtml || esc(data.title)}</h1>
              <p class="sub">${esc(data.subtitle)}</p>
              <div class="accent-rule"></div>
            </div>
            <div class="stories">${stories}</div>
            <div class="footer">
              <div class="cta-bar">
                <div class="cta">${esc(data.cta)}</div>
                <div class="url">${esc(data.url)}</div>
              </div>
            </div>
          </div>`;
      }

      function renderBop(data) {
        const stamp = formatDateStamp(data.date);
        const ranks = (data.ranks || [])
          .map(
            (r, i) => `
            <div class="rank ${i === 0 ? "gold" : ""}">
              <div class="num">#${i + 1}</div>
              <div>
                <div class="name">${esc(r.name)}</div>
                <div class="team">${esc(r.team)}</div>
              </div>
              <div class="metric">
                <div class="v">${esc(r.value)}</div>
                <div class="l">${esc(r.label)}</div>
              </div>
            </div>`,
          )
          .join("");
        const chips = (data.chips || [])
          .map((c) => `<span class="chip">${esc(c)}</span>`)
          .join("");

        return `
          <div class="watermark">${esc(data.priceMark || "")}</div>
          <div class="content">
            <div class="top">
              <div class="brand-lockup">
                <div class="brand">FALE<span>AGUE</span></div>
                <div class="eyebrow">${esc(data.eyebrow)}</div>
              </div>
              <div class="date-stamp">
                <div class="mmdd">${esc(stamp.mmdd)}</div>
                <div class="yyyy">${esc(stamp.yyyy)}</div>
              </div>
            </div>
            <div class="hero">
              <div class="hero-metric">
                <div class="price">£${esc(data.price)}</div>
                <div class="pos">${esc(data.position)}</div>
              </div>
              <h1 style="font-size:44px;margin-top:10px">${esc(data.title)}</h1>
              <p class="sub">${esc(data.subtitle)}</p>
              <div class="accent-rule"></div>
            </div>
            <div class="ranks">${ranks}</div>
            ${chips ? `<div class="chip-row">${chips}</div>` : ""}
            <div class="footer">
              <div class="cta-bar">
                <div class="cta">${esc(data.cta)}</div>
                <div class="url">${esc(data.urlShort || data.url)}</div>
              </div>
            </div>
          </div>`;
      }

      function render(data) {
        const root = document.getElementById("root");
        root.innerHTML = data.kind === "bop" ? renderBop(data) : renderDaily(data);
      }

      if (window.__POSTER__) render(window.__POSTER__);
    </script>
  </body>
</html>
