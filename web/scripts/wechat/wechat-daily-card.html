<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <title>FALEAGUE DAILY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        min-height: 1440px;
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background: #0b0a0f;
        color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 1080px;
        min-height: 1440px;
        padding: 56px 52px 64px;
        background:
          radial-gradient(900px 500px at 10% -5%, rgba(56, 189, 148, 0.14), transparent 55%),
          radial-gradient(700px 420px at 95% 0%, rgba(99, 102, 241, 0.12), transparent 50%),
          #0b0a0f;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }

      .brand-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #a7f3d0;
      }

      .brand-date {
        font-size: 24px;
        color: #a1a1aa;
      }

      h1 {
        font-size: 44px;
        line-height: 1.2;
        margin-bottom: 36px;
      }

      .section {
        margin-bottom: 28px;
      }

      .section-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #e4e4e7;
      }

      .section ul {
        list-style: none;
        padding: 0;
      }

      .section li {
        position: relative;
        padding-left: 22px;
        margin-bottom: 10px;
        font-size: 24px;
        line-height: 1.45;
        color: #d4d4d8;
      }

      .section li::before {
        content: "•";
        position: absolute;
        left: 0;
        color: #34d399;
      }

      .tip,
      .discussion {
        border-radius: 16px;
        padding: 20px 22px;
        margin-top: 8px;
        font-size: 24px;
        line-height: 1.45;
      }

      .tip {
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(129, 140, 248, 0.25);
      }

      .discussion {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.25);
        margin-top: 20px;
      }

      .fixtures {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .fixture-day {
        border-radius: 16px;
        padding: 16px 18px 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .fixture-day-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 24px;
        font-weight: 700;
        color: #a7f3d0;
      }

      .fixture-day-title .count {
        font-size: 20px;
        font-weight: 500;
        color: #a1a1aa;
      }

      .fixture-row {
        display: block;
        padding: 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 23px;
        line-height: 1.35;
      }

      .fixture-row:first-of-type {
        border-top: none;
        padding-top: 0;
      }

      .fixture-pair {
        color: #e4e4e7;
        font-weight: 600;
      }

      .footer {
        margin-top: 36px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 22px;
        color: #a1a1aa;
        line-height: 1.6;
      }

      .footer strong {
        color: #d4d4d8;
      }
    </style>
  </head>
  <body>
    <div class="card" id="root"></div>
    <script>
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function parseUpcomingFixtures(lines) {
        const groups = [];
        let cur = null;
        for (const raw of lines || []) {
          const line = String(raw || "").trim();
          const header = line.match(/^▸\s*(.+?)（.+?）·\s*(\d+)\s*场/);
          if (header) {
            cur = { label: header[1], count: header[2], fixtures: [] };
            groups.push(cur);
            continue;
          }
          const fx = line.match(/^(.+?)\s+vs\s+(.+)$/);
          if (fx && cur) {
            cur.fixtures.push({
              home: fx[1].trim(),
              away: fx[2].trim(),
            });
          }
        }
        return groups;
      }

      function render(card) {
        const root = document.getElementById("root");
        const sections = (card.sections || [])
          .map((s) => {
            const isUpcoming = /即将到来的友谊赛/.test(s.title || "");
            if (isUpcoming) {
              const groups = parseUpcomingFixtures(s.lines || []);
              const body = groups.length
                ? `<div class="fixtures">${groups
                    .map(
                      (g) => `
                  <div class="fixture-day">
                    <div class="fixture-day-title">
                      <span>${esc(g.label)}</span>
                      <span class="count">${esc(g.count)} 场</span>
                    </div>
                    ${g.fixtures
                      .map(
                        (f) => `
                      <div class="fixture-row">
                        <div class="fixture-pair">${esc(f.home)} vs ${esc(f.away)}</div>
                      </div>`,
                      )
                      .join("")}
                  </div>`,
                    )
                    .join("")}</div>`
                : `<ul>${(s.lines || []).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`;
              return `
          <div class="section">
            <div class="section-title">${esc(s.title)}</div>
            ${body}
          </div>`;
            }
            return `
          <div class="section">
            <div class="section-title">${esc(s.title)}</div>
            <ul>${(s.lines || []).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
          </div>`;
          })
          .join("");

        const links = (card.links || [])
          .map((l) => `<div>${esc(l.label)}：${esc(l.href)}</div>`)
          .join("");

        root.innerHTML = `
          <div class="brand">
            <div class="brand-name">FALEAGUE AI</div>
            <div class="brand-date">${esc(card.card_date)}</div>
          </div>
          <h1>📋 FALEAGUE DAILY</h1>
          ${sections}
          <div class="discussion">💬 ${esc(card.discussion_prompt)}</div>
          <div class="footer">
            <strong>链接</strong>
            ${links}
          </div>`;
      }

      if (window.__CARD__) render(window.__CARD__);
    </script>
  </body>
</html>
